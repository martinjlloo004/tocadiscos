<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tocadiscos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tocadiscos">
<meta name="theme-color" content="#070708">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Moderno y minimalista: negro profundo, la carátula difuminada como luz de fondo, un solo acento ámbar.
     Disco a la izquierda y texto alineado abajo a la derecha en horizontal; apilado en vertical. */
  :root {
    --bg: #070708;
    --ink: #F4F2EE;
    --soft: #8E8B86;
    --faint: #3A3936;
    --line: #1C1C1E;
    --accent: #F5A524;
    --display: "Geist", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--display);
    overflow: hidden; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  .backdrop {
    position: fixed; inset: -15%; z-index: 0; pointer-events: none;
    background-size: cover; background-position: center;
    filter: blur(90px) saturate(1.3); opacity: 0; transform: scale(1.1);
    transition: opacity 1.6s ease, background-image .1s;
  }
  .backdrop.on { opacity: .28; }
  .shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 30% 50%, transparent 30%, var(--bg) 85%); }
  .app {
    position: relative; z-index: 1; height: 100%;
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
    gap: clamp(24px, 5vw, 96px);
    padding-top: max(32px, env(safe-area-inset-top, 0px));
    padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 1500px; margin: 0 auto;
  }
  .stage { width: min(84vh, 54vw); aspect-ratio: 1; max-width: 100%; }
  canvas { width: 100%; height: 100%; display: block; }

  .info { min-width: 0; display: flex; flex-direction: column; gap: 10px; padding-right: 3vw; }
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft);
    margin-bottom: clamp(12px, 3vh, 40px);
  }
  .status { display: inline-flex; align-items: center; gap: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .4s; }
  .dot.live { background: var(--accent); box-shadow: 0 0 0 4px rgb(245 165 36 / .15); }
  .clock { font-variant-numeric: tabular-nums; }
  h1 {
    margin: 0; font-weight: 600; letter-spacing: -.045em; line-height: .95;
    font-size: clamp(34px, 5vw, 84px); text-wrap: balance; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .artist { margin: 6px 0 0; font-size: clamp(17px, 1.9vw, 26px); font-weight: 400; letter-spacing: -.015em; color: var(--ink); opacity: .7; overflow-wrap: anywhere; }
  .album { margin: 0; font-size: clamp(13px, 1.2vw, 16px); font-weight: 400; color: var(--soft); overflow-wrap: anywhere; }

  .progress { display: grid; gap: 10px; max-width: 520px; margin-top: clamp(16px, 4vh, 48px); }
  .bar { height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 2px; }
  .times { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 18px; transition: opacity .6s ease; }
  .app.idle .controls { opacity: 0; pointer-events: none; }
  button {
    font: 500 14px/1 var(--display); letter-spacing: -.01em; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 16px; border-radius: 999px; border: 0;
    background: rgb(255 255 255 / .06); color: var(--ink);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  button.icon { width: 40px; padding: 0; color: var(--soft); }
  button.primary { background: var(--ink); color: var(--bg); }
  button svg { width: 16px; height: 16px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; margin-left: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--soft); }
  .chip svg { width: 14px; height: 14px; }
  .chip.on svg { color: var(--accent); }
  .notice { margin: 8px 0 0; font-size: 14px; line-height: 1.5; color: var(--soft); max-width: 46ch; }
  .notice:empty { display: none; }

  @media (orientation: portrait), (max-width: 700px) {
    body { overflow-y: auto; }
    .app { grid-template-columns: minmax(0, 1fr); align-content: center; justify-items: center; height: auto; min-height: 100%; }
    .stage { width: min(88vw, 56vh); }
    .info { width: 100%; max-width: 640px; padding-right: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .backdrop { transition: none; } }
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="shade"></div>
<main class="app" id="app">
  <div class="stage"><canvas id="deck" aria-label="Vinilo girando"></canvas></div>
  <section class="info" aria-live="polite">
    <div class="top">
      <span class="status"><i class="dot" id="dot"></i><span id="eyebrowText">Tocadiscos</span></span>
      <span class="clock"><span id="clock">--:--</span> · v4</span>
    </div>
    <h1 id="title">Tu música, girando</h1>
    <p class="artist" id="artist">Conecta tu Spotify para ver lo que suena</p>
    <p class="album" id="album">Funciona con la canción de tu celular, computador o este mismo iPad</p>
    <div class="progress">
      <div class="bar"><i id="fill"></i></div>
      <div class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
    </div>
    <p class="notice" id="notice"></p>
    <div class="controls">
      <button class="primary" id="login" type="button">Conectar Spotify</button>
      <button class="icon" id="full" type="button" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="icon" id="logout" type="button" aria-label="Desconectar Spotify" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
      <span class="chip" id="wake">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="wakeText">Pantalla: normal</span>
      </span>
    </div>
  </section>
</main>

<script>
(() => {
  // Client ID de la app creada en developer.spotify.com (no es secreto).
  const CLIENT_ID = "f12589d0d997473894b0bbfea1619866";
  const SCOPES = "user-read-currently-playing user-read-playback-state";
  const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");
  const POLL_MS = 5000;

  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  const state = { track: null, cover: null, tint: [245, 165, 36] };

  // ---------- reloj ----------
  const clockFmt = new Intl.DateTimeFormat("es-CO", { weekday: "short", hour: "2-digit", minute: "2-digit" });
  const tickClock = () => { $("clock").textContent = clockFmt.format(new Date()); };
  tickClock(); setInterval(tickClock, 15000);

  const setNotice = (t) => { $("notice").textContent = t; };
  const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

  // ---------- inicio de sesión con Spotify (PKCE, sin servidor) ----------
  const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  function randomString(n) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const v = crypto.getRandomValues(new Uint8Array(n));
    return Array.from(v, (x) => chars[x % chars.length]).join("");
  }

  async function login() {
    if (CLIENT_ID === "PEGAR_CLIENT_ID") { setNotice("Falta el Client ID de Spotify en la página."); return; }
    const verifier = randomString(64);
    store.set("tc_verifier", verifier);
    const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    const q = new URLSearchParams({
      response_type: "code", client_id: CLIENT_ID, scope: SCOPES,
      code_challenge_method: "S256", code_challenge: challenge, redirect_uri: REDIRECT,
    });
    location.href = "https://accounts.spotify.com/authorize?" + q;
  }

  async function tokenRequest(params) {
    const r = await fetch("https://accounts.spotify.com/api/token", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ client_id: CLIENT_ID, ...params }),
    });
    if (!r.ok) throw new Error("token " + r.status);
    const j = await r.json();
    store.set("tc_access", j.access_token);
    store.set("tc_expires", String(Date.now() + (j.expires_in - 60) * 1000));
    if (j.refresh_token) store.set("tc_refresh", j.refresh_token);
  }

  async function finishLogin() {
    const p = new URLSearchParams(location.search);
    if (!p.has("code") && !p.has("error")) return;
    history.replaceState(null, "", REDIRECT);
    if (p.has("error")) { setNotice("No se conectó Spotify: " + p.get("error") + "."); return; }
    try {
      await tokenRequest({ grant_type: "authorization_code", code: p.get("code"), redirect_uri: REDIRECT, code_verifier: store.get("tc_verifier") || "" });
    } catch { setNotice("Spotify no aceptó el inicio de sesión. Toca Conectar Spotify otra vez."); }
    store.del("tc_verifier");
  }

  async function accessToken() {
    if (!store.get("tc_refresh")) return null;
    if (Date.now() < Number(store.get("tc_expires") || 0)) return store.get("tc_access");
    await tokenRequest({ grant_type: "refresh_token", refresh_token: store.get("tc_refresh") });
    return store.get("tc_access");
  }

  function logout() {
    ["tc_access", "tc_refresh", "tc_expires"].forEach(store.del);
    location.reload();
  }

  // ---------- canción actual ----------
  let backoffUntil = 0;
  async function poll() {
    if (Date.now() < backoffUntil) return;
    let token;
    try { token = await accessToken(); } catch {
      setNotice("La sesión de Spotify venció. Toca Conectar Spotify.");
      showLogin(true); return;
    }
    if (!token) { showLogin(true); return; }
    let r;
    try {
      r = await fetch("https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode", {
        headers: { Authorization: "Bearer " + token },
      });
    } catch { setNotice("Sin internet. Sigo intentando."); return; }
    if (r.status === 401) { store.set("tc_expires", "0"); return; }
    if (r.status === 429) { backoffUntil = Date.now() + (Number(r.headers.get("Retry-After")) || 30) * 1000; return; }
    if (r.status === 403) { setNotice("Spotify no deja leer esta cuenta. Revisa que tu correo esté en Users Management de la app de Spotify."); return; }
    if (!r.ok && r.status !== 204) { setNotice("Spotify respondió " + r.status + ". Sigo intentando."); return; }
    const j = r.status === 204 ? null : await r.json().catch(() => null);
    if (j && j.item) { apply(j); return; }
    // sin canción: se pregunta también por el estado del reproductor, que a veces sí la trae
    await fallback(token, r.status, j);
  }

  async function fallback(token, cpStatus, cp) {
    let p = null, ps = 0;
    try {
      const r = await fetch("https://api.spotify.com/v1/me/player?additional_types=episode", {
        headers: { Authorization: "Bearer " + token },
      });
      ps = r.status;
      if (r.status === 200) p = await r.json().catch(() => null);
    } catch {}
    if (p && p.item) { apply(p); return; }
    apply(null);
    const d = p && p.device;
    setNotice("Spotify no reporta canción. Detalle: actual " + cpStatus +
      (cp ? " tipo " + (cp.currently_playing_type || "?") : "") +
      ", reproductor " + ps +
      (d ? " en " + (d.name || "?") + (d.is_private_session ? " (sesión privada)" : "") : " sin dispositivo") +
      (p ? (p.is_playing ? ", sonando" : ", pausado") : "") + ".");
  }

  function parse(j) {
    const it = j && j.item;
    if (!it) return null;
    const isEp = j.currently_playing_type === "episode" || it.type === "episode";
    const images = isEp ? (it.images || (it.show && it.show.images) || []) : ((it.album && it.album.images) || []);
    return {
      id: it.id || it.uri || it.name,
      title: it.name,
      artist: isEp ? (it.show ? it.show.name : "") : (it.artists || []).map((a) => a.name).join(", "),
      album: isEp ? "Podcast" : (it.album ? it.album.name : ""),
      image: images.length ? images[0].url : "",
      duration: it.duration_ms || 0,
      progress: j.progress_ms || 0,
      playing: !!j.is_playing,
    };
  }

  let endTimer = 0;
  function apply(j) {
    const t = parse(j);
    setNotice("");
    if (!t) {
      if (state.track) state.track = { ...state.track, playing: false, progress: estProgress(), at: Date.now() };
      $("eyebrowText").textContent = "En silencio";
      $("dot").classList.remove("live");
      if (!state.track) {
        $("title").textContent = "Nada sonando";
        $("artist").textContent = "Pon una canción en Spotify y aparecerá aquí";
        $("album").textContent = "";
      }
      return;
    }
    const changed = !state.track || state.track.id !== t.id;
    state.track = { ...t, at: Date.now() };
    $("eyebrowText").textContent = t.playing ? "Sonando ahora" : "En pausa";
    $("dot").classList.toggle("live", t.playing);
    $("total").textContent = fmt(t.duration);
    if (changed) {
      $("title").textContent = t.title;
      $("artist").textContent = t.artist;
      $("album").textContent = t.album;
      loadCover(t);
    }
    clearTimeout(endTimer);
    if (t.playing && t.duration) endTimer = setTimeout(poll, Math.max(800, t.duration - t.progress + 600));
  }

  function estProgress() {
    const t = state.track; if (!t) return 0;
    const p = t.progress + (t.playing ? Date.now() - t.at : 0);
    return t.duration ? Math.min(p, t.duration) : p;
  }

  // carátula en el centro y color del brillo tomado de ella
  function loadCover(t) {
    state.cover = null;
    if (!t.image) { $("backdrop").classList.remove("on"); return; }
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      if (!state.track || state.track.id !== t.id) return;
      state.cover = img;
      $("backdrop").style.backgroundImage = `url("${t.image}")`;
      $("backdrop").classList.add("on");
      try {
        const c = document.createElement("canvas"); c.width = c.height = 16;
        const g = c.getContext("2d"); g.drawImage(img, 0, 0, 16, 16);
        const d = g.getImageData(0, 0, 16, 16).data;
        let r = 0, gg = 0, b = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) {
          const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
          const w = (mx - mn) / 255 + 0.05; // los colores vivos pesan más
          r += d[i] * w; gg += d[i + 1] * w; b += d[i + 2] * w; n += w;
        }
        // tono de la carátula, aclarado, para las ondas
        const k = 255 / Math.max(1, r / n, gg / n, b / n);
        state.tint = [(r / n) * k, (gg / n) * k, (b / n) * k].map((x) => Math.round(x * 0.75 + 255 * 0.25));
      } catch {}
    };
    img.src = t.image;
  }

  // ---------- pantalla siempre encendida ----------
  async function requestWake() {
    if (!("wakeLock" in navigator)) { setWake(false, "Pantalla: pon Bloqueo automático en Nunca"); return; }
    try {
      const lock = await navigator.wakeLock.request("screen");
      setWake(true, "Pantalla siempre encendida");
      lock.addEventListener("release", () => setWake(false, "Pantalla: toca para mantenerla encendida"));
    } catch {
      setWake(false, "Pantalla: toca para mantenerla encendida");
    }
  }
  function setWake(on, text) { $("wake").classList.toggle("on", on); $("wakeText").textContent = text; }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { requestWake(); poll(); }
  });
  addEventListener("pointerdown", () => { if (!$("wake").classList.contains("on")) requestWake(); }, { passive: true });

  // ---------- pantalla completa ----------
  const fsEl = document.documentElement;
  const canFs = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
  const standalone = matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches || navigator.standalone;
  if (!canFs || standalone) $("full").hidden = true;
  $("full").addEventListener("click", async () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        await canFs.call(fsEl);
      }
    } catch { $("full").hidden = true; }
    requestWake();
  });

  // ---------- botones ----------
  function showLogin(on) {
    $("login").hidden = !on;
    $("logout").hidden = on;
    if (on) $("app").classList.remove("idle");
  }
  $("login").addEventListener("click", login);
  $("logout").addEventListener("click", logout);

  let idleTimer = 0;
  function armIdle() {
    $("app").classList.remove("idle");
    clearTimeout(idleTimer);
    if ($("login").hidden && !$("notice").textContent) idleTimer = setTimeout(() => $("app").classList.add("idle"), 6000);
  }
  ["pointerdown", "pointermove", "keydown"].forEach((e) => addEventListener(e, armIdle, { passive: true }));

  // ---------- tocadiscos ----------
  const cv = $("deck"), ctx = cv.getContext("2d");
  let S = 0, dpr = 1, record = null;

  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    S = Math.max(10, Math.round(r.width));
    cv.width = S * dpr; cv.height = S * dpr;
    buildRecord();
  }
  new ResizeObserver(resize).observe(cv);

  // surcos del disco dibujados una vez
  function buildRecord() {
    const R = S * 0.38, px = Math.ceil(R * 2 * dpr);
    record = document.createElement("canvas");
    record.width = record.height = px;
    const g = record.getContext("2d");
    const c = px / 2, r = px / 2;
    g.fillStyle = "#111112";
    g.beginPath(); g.arc(c, c, r, 0, Math.PI * 2); g.fill();
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const gaps = [0.52, 0.63, 0.74, 0.85];
    for (let k = 0.36; k < 0.97; k += 0.0045) {
      const nearGap = gaps.some((gp) => Math.abs(k - gp) < 0.006);
      g.strokeStyle = nearGap ? "rgba(255,255,255,.015)" : `rgba(255,255,255,${0.025 + rnd() * 0.05})`;
      g.lineWidth = Math.max(1, r * 0.0022);
      g.beginPath(); g.arc(c, c, r * k, 0, Math.PI * 2); g.stroke();
    }
    g.strokeStyle = "rgba(255,255,255,.14)"; g.lineWidth = r * 0.008;
    g.beginPath(); g.arc(c, c, r * 0.985, 0, Math.PI * 2); g.stroke();
  }

  // ángulo del brazo: primer cruce desde la posición de reposo, así nunca salta al otro lado del disco
  function armAngle(px, py, cx, cy, L, rr) {
    for (let a = Math.PI * 0.44; a <= Math.PI * 1.1; a += 0.002) {
      if (Math.hypot(px + L * Math.cos(a) - cx, py + L * Math.sin(a) - cy) <= rr) return a;
    }
    return Math.PI * 0.44;
  }
  let armStart = 0, armEnd = 0, armFor = 0;

  const REST = Math.PI * 0.44;
  const OMEGA = (2 * Math.PI * (100 / 3)) / 60; // 33⅓ rpm
  let angle = 0, speed = 0, energy = 0.1, arm = REST, lift = 1, last = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    const tr = state.track;
    const playing = !!(tr && tr.playing);
    const ease = (cur, target, k) => cur + (target - cur) * Math.min(1, dt * k);

    speed = ease(speed, playing ? (reduced ? 0.6 : OMEGA) : (tr ? 0 : 0.4), playing ? 1.6 : 0.9);
    angle += speed * dt;
    energy = ease(energy, playing ? 1 : 0.08, 2);
    lift = ease(lift, playing ? 0 : 1, 3);

    const prog = tr && tr.duration ? estProgress() / tr.duration : 0;
    $("fill").style.width = (prog * 100).toFixed(2) + "%";
    $("elapsed").textContent = fmt(estProgress());

    if (!S || !record) { requestAnimationFrame(frame); return; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    const cx = S * 0.45, cy = S * 0.53, R = S * 0.38;

    // ondas alrededor del disco
    const n = 144, beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * (112 / 60))), 10);
    ctx.lineCap = "round";
    ctx.lineWidth = Math.max(1, S * 0.0022);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      let v = reduced ? 0.35 :
        0.45 + 0.35 * Math.sin(i * 0.29 + t * 2.1) * Math.sin(i * 0.071 - t * 1.25)
        + 0.2 * Math.sin(i * 1.63 + t * 4.7) + 0.35 * beat;
      v = Math.max(0.05, Math.abs(v));
      const h = S * 0.002 + v * S * 0.04 * energy;
      const r0 = R * 1.06;
      ctx.strokeStyle = `rgba(${state.tint.join(",")},${0.08 + 0.4 * energy * v})`;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * (r0 + h), cy + Math.sin(a) * (r0 + h));
      ctx.stroke();
    }

    // sombra del disco
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.7)"; ctx.shadowBlur = S * 0.06; ctx.shadowOffsetY = S * 0.015;
    ctx.fillStyle = "#111112";
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // disco + etiqueta (giran)
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(angle);
    ctx.drawImage(record, -R, -R, R * 2, R * 2);
    const LR = R * 0.36;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, LR, 0, Math.PI * 2); ctx.clip();
    if (state.cover) {
      ctx.drawImage(state.cover, -LR, -LR, LR * 2, LR * 2);
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = LR * 0.04;
      ctx.beginPath(); ctx.arc(0, 0, LR, 0, Math.PI * 2); ctx.stroke();
    } else {
      const lg = ctx.createRadialGradient(0, 0, LR * 0.1, 0, 0, LR);
      lg.addColorStop(0, "#1A1A1C");
      lg.addColorStop(1, "#0C0C0D");
      ctx.fillStyle = lg; ctx.fillRect(-LR, -LR, LR * 2, LR * 2);
      ctx.strokeStyle = "rgba(245,165,36,.6)"; ctx.lineWidth = LR * 0.01;
      ctx.beginPath(); ctx.arc(0, 0, LR * 0.92, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "rgba(239,232,220,.9)"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const fit = (txt, size, weight, y) => {
        ctx.font = `${weight} ${size}px "Geist", system-ui, sans-serif`;
        let s = txt || "";
        while (s.length > 1 && ctx.measureText(s).width > LR * 1.5) s = s.slice(0, -2) + "…";
        ctx.fillText(s, 0, y);
      };
      fit(tr ? tr.title : "Tocadiscos", LR * 0.15, 700, -LR * 0.42);
      fit(tr ? tr.artist : "Spotify", LR * 0.12, 500, -LR * 0.24);
      ctx.font = `500 ${LR * 0.09}px "Geist Mono", monospace`;
      ctx.fillStyle = "rgba(245,165,36,.8)";
      ctx.fillText("33⅓ RPM", 0, LR * 0.42);
      ctx.fillText("LADO A", 0, LR * 0.58);
    }
    ctx.restore();
    ctx.fillStyle = "#070708";
    ctx.beginPath(); ctx.arc(0, 0, R * 0.022, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // brillo fijo de la luz sobre el vinilo
    if (ctx.createConicGradient) {
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.arc(cx, cy, LR, 0, Math.PI * 2, true); ctx.clip();
      const cg = ctx.createConicGradient(-Math.PI / 3, cx, cy);
      cg.addColorStop(0, "rgba(255,255,255,0)");
      cg.addColorStop(0.07, "rgba(255,255,255,.13)");
      cg.addColorStop(0.16, "rgba(255,255,255,0)");
      cg.addColorStop(0.5, "rgba(255,255,255,0)");
      cg.addColorStop(0.57, "rgba(255,255,255,.09)");
      cg.addColorStop(0.66, "rgba(255,255,255,0)");
      cg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = cg; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
      ctx.restore();
    }

    // brazo
    const px = cx + R * 1.12, py = cy - R * 0.98, L = R * 1.5;
    if (armFor !== S) {
      armStart = armAngle(px, py, cx, cy, L, R * 0.93);
      armEnd = armAngle(px, py, cx, cy, L, R * 0.42);
      armFor = S;
    }
    const target = tr ? armStart + (armEnd - armStart) * Math.min(1, Math.max(0, prog)) : REST;
    arm = ease(arm, target, 1.2);
    const sx = px + L * Math.cos(arm), sy = py + L * Math.sin(arm);
    const off = S * (0.006 + 0.018 * lift);
    const drawArm = (dx, dy, shadow) => {
      ctx.save();
      ctx.translate(dx, dy);
      ctx.lineCap = "round";
      ctx.strokeStyle = shadow ? "rgba(0,0,0,.5)" : "#B9B6B0";
      ctx.lineWidth = R * 0.014;
      const bx = px - Math.cos(arm) * R * 0.22, by = py - Math.sin(arm) * R * 0.22;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(sx, sy); ctx.stroke();
      ctx.fillStyle = shadow ? "rgba(0,0,0,.5)" : "#2B2B2D";
      ctx.beginPath(); ctx.arc(bx, by, R * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.translate(sx, sy); ctx.rotate(arm + 0.35);
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-R * 0.02, -R * 0.045, R * 0.13, R * 0.09, R * 0.015) : ctx.rect(-R * 0.02, -R * 0.045, R * 0.13, R * 0.09); ctx.fill();
      if (!shadow) { ctx.fillStyle = "#F5A524"; ctx.fillRect(R * 0.095, -R * 0.045, R * 0.015, R * 0.09); }
      ctx.restore();
    };
    ctx.save(); ctx.filter = "blur(" + (S * 0.006).toFixed(1) + "px)"; drawArm(off, off * 1.3, true); ctx.restore();
    drawArm(0, 0, false);
    ctx.fillStyle = "#161618";
    ctx.strokeStyle = "#2E2E31"; ctx.lineWidth = R * 0.008;
    ctx.beginPath(); ctx.arc(px, py, R * 0.09, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#B9B6B0";
    ctx.beginPath(); ctx.arc(px, py, R * 0.028, 0, Math.PI * 2); ctx.fill();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- arranque ----------
  (async () => {
    await finishLogin();
    if (!store.get("tc_refresh")) { showLogin(true); return; }
    showLogin(false);
    requestWake();
    await poll();
    setInterval(() => { if (document.visibilityState === "visible") poll(); }, POLL_MS);
    armIdle();
  })();
})();
</script>
</body>
</html>
